nodes: 8
tasks_per_node: 4
tag: ssv2-16x2x3
eval_name: video_classification_frozen
resume_checkpoint: false

model_structure:
  num_register_tokens: 0
  dyt_encoder: true
  dyt_predictor: false

data:
  dataset_train: train-computer187.csv
  dataset_val: validation-computer187.csv
  dataset_type: VideoDataset
  num_classes: 174
  frames_per_clip: 16
  num_segments: 2
  num_views_per_segment: 3
  frame_step: 4
optimization:
  attend_across_segments: true
  num_epochs: 20
  resolution: 224
  batch_size: 16
  weight_decay: 0.05
  lr:  0.0005
  start_lr: 0.001
  final_lr: 0.00015
  warmup: 0.000001
  use_bfloat16: true
pretrain:
  model_name: vit_base
  checkpoint_key: target_encoder
  clip_duration: null
  frames_per_clip: 16
  tubelet_size: 2
  uniform_power: true
  use_silu: false
  tight_silu: false
  use_sdpa: true
  patch_size: 16
  folder: exp-vitb16-dyt-encoder/
  checkpoint: jepa-latest.pth.tar  # name of pretrained model file inside folder
  write_tag: jepa
